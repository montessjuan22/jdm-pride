<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - JDM Pride</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración para activar el modo oscuro por clase 'dark' -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-black dark:text-white font-sans antialiased selection:bg-red-600 selection:text-white transition-colors duration-300 min-h-screen flex flex-col justify-between">

    <!-- Navbar Adaptable -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-black/90 backdrop-blur-md border-b border-gray-200 dark:border-zinc-800 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                <!-- Logo / Brand -->
                <a href="../index.html" class="flex items-center space-x-2 text-xl font-bold text-red-600">
                    <span class="text-gray-900 dark:text-white">チロホ</span>
                    <span>JDM PRIDE</span>
                </a>

                <!-- Menú de navegación + Botón Modo Oscuro -->
                <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
                    <a href="../index.html" class="text-gray-600 dark:text-gray-300 hover:text-red-600 dark:hover:text-white transition">Inicio</a>
                    <a href="catalogo.html" class="text-gray-600 dark:text-gray-300 hover:text-red-600 dark:hover:text-white transition">Catálogo</a>
                    <a href="admin.html" class="text-gray-600 dark:text-gray-300 hover:text-red-600 dark:hover:text-white transition">Dashboard</a>
                    <a href="contacto.html" class="text-red-600 font-semibold">Contacto</a>

                    <!-- Botón Modo Oscuro / Claro -->
                    <button id="theme-toggle" type="button" class="border border-yellow-500 text-yellow-600 dark:text-yellow-500 hover:bg-yellow-500 hover:text-black px-3 py-1 rounded-md text-xs font-semibold transition">
                        🌙 / ☀️ Modo
                    </button>
                </nav>

            </div>
        </div>
    </header>

    <!-- Formulario de Contacto -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow flex items-center justify-center">
        <div class="w-full max-w-lg">
            
            <!-- Contenedor / Tarjeta del Formulario -->
            <div class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-2xl p-8 shadow-2xl transition-colors">
                
                <h2 class="text-3xl font-black text-center text-red-600 uppercase tracking-tight mb-6">
                    Cotiza con nosotros
                </h2>

                <!-- Formulario con ID para JavaScript -->
                <form id="formulario-contacto" class="space-y-5">
                    
                    <div>
                        <label for="nombre" class="block text-xs font-bold uppercase text-gray-700 dark:text-zinc-300 mb-2">
                            Nombre Completo
                        </label>
                        <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required
                            class="w-full bg-gray-50 dark:bg-black/80 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2.5 text-gray-900 dark:text-white focus:outline-none focus:border-red-600 transition-colors text-sm placeholder-gray-400 dark:placeholder-zinc-500">
                    </div>

                    <div>
                        <label for="correo" class="block text-xs font-bold uppercase text-gray-700 dark:text-zinc-300 mb-2">
                            Correo Electrónico
                        </label>
                        <input type="email" id="correo" placeholder="correo@ejemplo.com" required
                            class="w-full bg-gray-50 dark:bg-black/80 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2.5 text-gray-900 dark:text-white focus:outline-none focus:border-red-600 transition-colors text-sm placeholder-gray-400 dark:placeholder-zinc-500">
                    </div>

                    <div>
                        <label for="asunto" class="block text-xs font-bold uppercase text-gray-700 dark:text-zinc-300 mb-2">
                            Modelo de Interés
                        </label>
                        <input type="text" id="asunto" placeholder="Ej: Nissan Skyline R34"
                            class="w-full bg-gray-50 dark:bg-black/80 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2.5 text-gray-900 dark:text-white focus:outline-none focus:border-red-600 transition-colors text-sm placeholder-gray-400 dark:placeholder-zinc-500">
                    </div>

                    <div>
                        <label for="mensaje" class="block text-xs font-bold uppercase text-gray-700 dark:text-zinc-300 mb-2">
                            Mensaje
                        </label>
                        <textarea id="mensaje" rows="4" placeholder="Escribe tu consulta aquí..." required
                            class="w-full bg-gray-50 dark:bg-black/80 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2.5 text-gray-900 dark:text-white focus:outline-none focus:border-red-600 transition-colors text-sm placeholder-gray-400 dark:placeholder-zinc-500 resize-none"></textarea>
                    </div>

                    <button type="submit"
                        class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition-colors uppercase text-sm tracking-wider shadow-lg shadow-red-600/30">
                        Cotizar
                    </button>
                    
                </form>

            </div>
        </div>
    </main>

    <!-- Footer / Pie de página -->
    <footer class="bg-gray-200 dark:bg-zinc-950 border-t border-gray-300 dark:border-zinc-800 py-6 transition-colors text-center">
        <p class="text-xs text-gray-600 dark:text-zinc-500">
            © 2026 JDM Pride. Todos los derechos reservados.
        </p>
    </footer>

    
    <script src="../js/darkmodet.js"></script>
    <script src="../js/Formulario.js"></script>
</body>

</html>
